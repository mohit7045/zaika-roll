<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaika Kathi Roll | Delivery Partner Login</title>
    <link rel="stylesheet" href="delivery.css">
</head>
<body class="admin-body">

<div id="loginScreen" class="admin-login">
    <div class="login-box">
        <h2>Delivery Login</h2>
        <p>Enter your phone number and password</p>

        <input type="tel" id="deliveryPhone" placeholder="Phone Number" autocomplete="tel">
        <input type="password" id="deliveryPassword" placeholder="Password" autocomplete="current-password">

        <button onclick="deliveryLogin()">Login</button>
        <p id="loginError" style="color: red; margin-top: 15px;"></p>

        <a href="index.html" class="back-website">← Back to Website</a>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check-compat.js"></script>

<script>
    // Firebase Setup
    const firebaseConfig = {
        apiKey: "AIzaSyDpi0roEK4cAYRqqHJ2y1uT0fjdk4u_LM0",
        authDomain: "foodhub-restaurant-22790.firebaseapp.com",
        projectId: "foodhub-restaurant-22790",
        storageBucket: "foodhub-restaurant-22790.firebasestorage.app",
        messagingSenderId: "1016193457906",
        appId: "1:1016193457906:web:6e6cbaa0980393e1befa6b",
        measurementId: "G-E27MPW12XR"
    };
    firebase.initializeApp(firebaseConfig);

    // App Check — replace placeholder with your real reCAPTCHA v3 site key
    // from Firebase Console → App Check. Harmless no-op until you do.
    if (typeof firebase.appCheck === "function") {
        const appCheck = firebase.appCheck();
        appCheck.activate("6LfxO4EtAAAAAN-1jA3MKguh9CVXfqv1oMQVBrmP", true);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    // Real "already logged in" check — driven by Firebase Auth state,
    // not a spoofable localStorage flag.

    auth.onAuthStateChanged(user => {
        if (user) {
            window.location.href = "delivery-dashboard.html";
        }
    });

    



async function deliveryLogin() {
    const phone = document.getElementById("deliveryPhone").value.trim();
    const password = document.getElementById("deliveryPassword").value.trim();
    const error = document.getElementById("loginError");
    const loginBtn = document.querySelector(".login-box button");

    if (!phone || !password) {
        error.textContent = "Please enter phone and password.";
        return;
    }

    const email = `${phone}@zaikaroll.com`;

    try {
        loginBtn.textContent = "Logging in...";
        loginBtn.disabled = true;
        error.textContent = "";

        // Secure Firebase Authentication
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = "delivery-dashboard.html";

    } catch (err) {
        console.error("Login error:", err);
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
            error.textContent = "Invalid phone number or password.";
        } else {
            error.textContent = "Login failed. Please try again.";
        }
        loginBtn.textContent = "Login";
        loginBtn.disabled = false;
    }
}    
</script>

</body>
</html>
